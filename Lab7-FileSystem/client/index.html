<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CafeHub - Lab 7 File System</title>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-[#F5F1E8] min-h-screen">


<header class="bg-[#4B5136] text-white p-5">

<h1 class="text-3xl font-bold text-center">

CafeHub

</h1>

</header>


<main class="max-w-xl mx-auto p-6">


<div class="bg-white p-6 rounded-xl shadow-lg">

<h2 class="text-2xl font-bold mb-5">

File System CRUD

</h2>


<form id="cafeForm">


<input
type="text"
id="name"
placeholder="Cafe Name"
required
class="border p-3 w-full rounded mb-3"
>


<input
type="text"
id="location"
placeholder="Location"
required
class="border p-3 w-full rounded mb-3"
>


<input
type="text"
id="event"
placeholder="Speciality / Event"
required
class="border p-3 w-full rounded mb-3"
>


<button
type="submit"
class="bg-[#6B4426] text-white p-3 w-full rounded">

Save Cafe

</button>


</form>

</div>


<div class="bg-white p-6 rounded-xl shadow-lg mt-6">

<h2 class="text-2xl font-bold mb-5">

Cafe List

</h2>

<ul id="cafeList"></ul>

</div>


</main>


<script>

const form =
document.getElementById("cafeForm");

const nameInput =
document.getElementById("name");

const locationInput =
document.getElementById("location");

const eventInput =
document.getElementById("event");

const cafeList =
document.getElementById("cafeList");

let editId = null;


// ========================================
// GET CAFES
// ========================================

async function loadCafes() {

    try {

        const response =
            await axios.get("/api/file-cafes");

        displayCafes(response.data);

    }

    catch (error) {

        console.log(error);

    }

}

// DISPLAY CAFES


function displayCafes(cafes) {

    cafeList.innerHTML = "";


    cafes.forEach(cafe => {

        cafeList.innerHTML += `

        <li class="border-b py-4">

            <div class="mb-3">

                <strong>
                    ${cafe.name}
                </strong>

                <br>

                ${cafe.location}

                <br>

                ${cafe.event}

            </div>


            <button
                onclick="editCafe(${cafe.id})"
                class="bg-yellow-500 text-white px-3 py-1 rounded">

                Edit

            </button>


            <button
                onclick="deleteCafe(${cafe.id})"
                class="bg-red-500 text-white px-3 py-1 rounded">

                Delete

            </button>

        </li>

        `;

    });

}


// POST / PUT


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const cafe = {

            name: nameInput.value,

            location: locationInput.value,

            event: eventInput.value,

            rating: 4.5

        };


        try {


            if (editId === null) {

                await axios.post(
                    "/api/file-cafes",
                    cafe
                );

            }

            else {

                await axios.put(
                    `/api/file-cafes/${editId}`,
                    cafe
                );

                editId = null;

            }


            form.reset();

            loadCafes();

        }

        catch (error) {

            console.log(error);

        }

    }
);



// EDIT

async function editCafe(id) {

    const response =
        await axios.get("/api/file-cafes");

    const cafes = response.data;

    const selected =
        cafes.find(cafe => cafe.id === id);


    nameInput.value =
        selected.name;

    locationInput.value =
        selected.location;

    eventInput.value =
        selected.event;

    editId = id;

}



// DELETE


async function deleteCafe(id) {

    if (
        confirm("Delete this cafe?")
    ) {

        await axios.delete(
            `/api/file-cafes/${id}`
        );

        loadCafes();

    }

}


// Load data when page opens

loadCafes();

</script>


</body>

</html>
