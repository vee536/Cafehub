<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cafe CRUD</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

</head>

<body>

<h1 class="text-3xl font-bold text-center mb-8 text-brown-700">

CafeHub - Cafe Manager

</h1>


<div class="bg-white p-6 rounded-lg shadow w-full max-w-md mx-auto">

<form id="cafeForm">

<input
type="text"
id="cafe"
placeholder="Cafe Name"
class="border w-full p-2 rounded mb-3">

<input
type="text"
id="location"
placeholder="Location"
class="border w-full p-2 rounded mb-3">

<input
type="text"
id="speciality"
placeholder="Speciality"
class="border w-full p-2 rounded mb-3">

<button
type="submit"
class="bg-amber-700 text-white w-full p-2 rounded">

Save Cafe

</button>

</form>

</div>

<div class="bg-white shadow rounded-lg p-5 max-w-md mx-auto mt-8">

<h2 class="font-bold text-xl mb-4">

Cafe List

</h2>

<ul id="cafeList"></ul>

</div>

<script>

const form = document.getElementById("cafeForm");
const cafe = document.getElementById("cafe");
const locationInput = document.getElementById("location");
const speciality = document.getElementById("speciality");
const list = document.getElementById("cafeList");

let editId = null;

// Load Cafes
async function loadCafes() {

    try {

        const response = await axios.get("http://localhost:3000/api/cafes");

        display(response.data);

    }

    catch (err) {

        console.error(err);

    }

}

loadCafes();


// Save / Update Cafe
form.addEventListener("submit", async function (e) {

    e.preventDefault();

    if (
        cafe.value === "" ||
        locationInput.value === "" ||
        speciality.value === ""
    ) {

        alert("Fill all details");
        return;

    }

    const obj = {

        name: cafe.value,
        location: locationInput.value,
        event: speciality.value,
        rating: 4.5

    };

    try {

        console.log("Submitting...", obj);

        if (editId == null) {

            await axios.post(
                "http://localhost:3000/api/cafes",
                obj
            );

        }

        else {

            await axios.put(
                "http://localhost:3000/api/cafes/" + editId,
                obj
            );

            editId = null;

        }

        form.reset();

        loadCafes();

    }

    catch (err) {

        console.error(err);

        alert(err.response?.data?.message || err.message);

    }

});


// Display Cafes
function display(cafes) {

    list.innerHTML = "";

    cafes.forEach(function (item) {

        list.innerHTML += `

        <li class="border-b py-3 flex justify-between">

            <div>

                <b>${item.name}</b><br>

                ${item.location}<br>

                ${item.event}

            </div>

            <div>

                <button
                    onclick="editCafe('${item._id}')"
                    class="bg-yellow-400 px-2 rounded mr-2">

                    Edit

                </button>

                <button
                    onclick="deleteCafe('${item._id}')"
                    class="bg-red-500 text-white px-2 rounded">

                    Delete

                </button>

            </div>

        </li>

        `;

    });

}


// Edit Cafe
async function editCafe(id) {

    try {

        const response = await axios.get(
            "http://localhost:3000/api/cafes"
        );

        const cafes = response.data;

        const selected = cafes.find(c => c._id === id);

        cafe.value = selected.name;
        locationInput.value = selected.location;
        speciality.value = selected.event;

        editId = id;

    }

    catch (err) {

        console.error(err);

    }

}


// Delete Cafe
async function deleteCafe(id) {

    if (confirm("Delete this cafe?")) {

        try {

            await axios.delete(
                "http://localhost:3000/api/cafes/" + id
            );

            loadCafes();

        }

        catch (err) {

            console.error(err);

        }

    }

}

</script>
</body>
</html>
