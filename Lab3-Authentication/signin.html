<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Sign In | CafeHub</title>

<link rel="stylesheet" href="../style.css">
<script src="https://cdn.tailwindcss.com"></script>

</head>

<body>

<header>

<h2>CafeHub</h2>

<nav>

<a href="../index.html">Home</a>
<a href="../events.html">Events</a>
<a href="../meetups.html">Meetups</a>
<a href="../bookclubs.html">Book Clubs</a>
<a href="../workshops.html">Workshops</a>
<a href="../community.html">Community</a>
<a href="registration.html">Registration</a>
<a href="signin.html">Sign In</a>

</nav>

</header>

<div
class="flex justify-center items-center"
style="
min-height:80vh;
background-image:url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-position:center;
padding:50px;
">

<div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md">

<h1 class="text-4xl font-bold text-center text-[#4B5136] mb-2">

CafeHub

</h1>

<p class="text-center text-gray-600 mb-8">

Welcome Back!

</p>

<form onsubmit="return validateSignin()">

<input
id="email"
type="email"
placeholder="Email Address"
required
class="w-full p-3 border rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-[#6B4426]"
>

<input
id="signinPassword"
type="password"
placeholder="Password"
required
minlength="6"
class="w-full p-3 border rounded-xl mb-6 focus:outline-none focus:ring-2 focus:ring-[#6B4426]"
>

<button
type="submit"
class="w-full bg-[#6B4426] text-white py-3 rounded-xl hover:bg-[#553519] transition">

Sign In

</button>

</form>

<p class="text-center mt-6">

Don't have an account?

<a
href="registration.html"
class="text-[#6B4426] font-semibold">

Register

</a>

</p>

<p class="text-center mt-5">

<a
href="../index.html"
class="text-gray-500 hover:text-black">

← Back to Home

</a>

</p>

</div>

</div>

<footer>

© 2026 CafeHub

</footer>

<script src="../script.js"></script>

</body>

</html>
